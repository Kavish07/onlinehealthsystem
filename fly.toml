# Fly.io app config. The app name below is a placeholder - Fly app names are
# globally unique, so change it before the first `fly launch`/`fly deploy`
# if "onlinehealthsystem-demo" is already taken.
app = "onlinehealthsystem-demo"
primary_region = "iad"

[build]

[mounts]
  source = "mysql_data"
  destination = "/var/lib/mysql"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
