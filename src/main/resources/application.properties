# Centralized JDBC config for the Spring Boot migration (see spring-boot-migration
# skill, Step 3). Points at the same local PostgreSQL database the legacy
# com.onlinehealthsystem DAOs currently hardcode via per-method
# DriverManager.getConnection(...) calls.
#
# DB_USERNAME/DB_PASSWORD come from a git-ignored .env file locally (see
# .env.example) or from real container/platform env vars in Docker/Fly - never
# hardcoded here. No default is given, so startup fails loudly if neither is set.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/onlinehealthsystem
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema already exists (created/maintained by the legacy app's SQL).
# Never let Hibernate auto-create or alter it; only validate mapped
# entities against what's actually there.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring Boot's default SpringPhysicalNamingStrategy rewrites every
# identifier to snake_case/lowercase, even ones with an explicit
# @Column/@Table name (e.g. "UserName" -> "user_name", "LoginHistory" ->
# "login_history") - which would no longer match the real schema's PascalCase
# names under ddl-auto=validate. This makes explicit @Column/@Table names
# authoritative, as written, instead.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
