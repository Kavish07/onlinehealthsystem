# Test-only override: @DataJpaTest/@SpringBootTest slices run against an
# embedded H2 database (added as a test-scope dependency), not the real
# MySQL instance src/main/resources/application.properties points at - this
# environment has no reachable MySQL/Docker. ddl-auto=create-drop lets
# Hibernate build the schema from the entity mappings for each test run,
# since there's no persistent schema to validate against here.
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:onlinehealthsystem;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mirrors the main properties' naming-strategy override so the H2 test
# schema actually exercises the real @Column/@Table names, instead of
# masking a naming mismatch behind H2 and MySQL generating the same
# (wrong) snake_case names on both sides.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
